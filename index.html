  <script>
    function initReveals() {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var targets = Array.prototype.slice.call(document.querySelectorAll(
        '.hero .star-divider, .hero .subheading, .hero .script-name, .hero .heart-icon, .details-grid, .rsvp-card'
      ));
      if (!targets.length) return;

      targets.forEach(function(el) { el.classList.add('reveal'); });

      var io = new IntersectionObserver(function(entries) {
        entries.forEach(function(entry) {
          if (!entry.isIntersecting) return;
          entry.target.classList.add('reveal-in');
          io.unobserve(entry.target);
        });
      }, { threshold: 0.12, rootMargin: '0px 0px -10% 0px' });

      targets.forEach(function(el) { io.observe(el); });
    }

    /* ── Mobile menu ── */
    function toggleMenu() {
      var menu = document.getElementById('mobileMenu');
      var btn = document.querySelector('.site-nav .hamburger');
      var open = menu && menu.classList.contains('open');
      setMenuOpen(!open);
    }

    var lastMenuFocus = null;
    function getMenuFocusable() {
      var menu = document.getElementById('mobileMenu');
      if (!menu) return [];
      return Array.prototype.slice.call(menu.querySelectorAll('a[href], button:not([disabled]), [tabindex]:not([tabindex="-1"])'))
        .filter(function(el) { return el.offsetParent !== null; });
    }

    function setMenuOpen(open) {
      var menu = document.getElementById('mobileMenu');
      var btn = document.querySelector('.site-nav .hamburger');
      if (!menu) return;

      if (open) {
        lastMenuFocus = document.activeElement;
        menu.classList.add('open');
        document.body.style.overflow = 'hidden';
        if (btn) {
          btn.setAttribute('aria-expanded', 'true');
          btn.setAttribute('aria-label', 'Close navigation menu');
        }
        window.setTimeout(function() {
          var focusables = getMenuFocusable();
          if (focusables[0]) focusables[0].focus();
        }, 0);
      } else {
        menu.classList.remove('open');
        document.body.style.overflow = '';
        if (btn) {
          btn.setAttribute('aria-expanded', 'false');
          btn.setAttribute('aria-label', 'Open navigation menu');
        }
        if (lastMenuFocus && typeof lastMenuFocus.focus === 'function') {
          lastMenuFocus.focus();
        } else if (btn) {
          btn.focus();
        }
        lastMenuFocus = null;
      }
    }
    document.querySelectorAll('.mobile-menu-links a').forEach(function(a) {
      a.addEventListener('click', function() {
        setMenuOpen(false);
      });
    });
    document.addEventListener('keydown', function(e) {
      var menu = document.getElementById('mobileMenu');
      if (!menu || !menu.classList.contains('open')) return;

      if (e.key === 'Escape') {
        setMenuOpen(false);
        return;
      }

      if (e.key === 'Tab') {
        var focusables = getMenuFocusable();
        if (!focusables.length) return;
        var first = focusables[0];
        var last = focusables[focusables.length - 1];
        var active = document.activeElement;
        if (e.shiftKey && active === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && active === last) {
          e.preventDefault();
          first.focus();
        }
      }
    });

    initReveals();

    /* ── Guest list ── */
    var GUESTS = [
      "Cindy Smith","Scott Smith","Cassie Smith","Cassie Ford Smith","Jeremy Smith",
      "Canon Smith","Owen Smith","Dustin Smith","Kali Smith","Kinsley Smith",
      "Tracy Rubio","Jean Rubio","Jim Rubio","Sandi Rubio","Steve Smith",

      "Paul Ryder","Mike Malenfant","Rich Hurley","Mikey Lightfoot",
      "Montana Lightfoot","Natalia Reiss","Pasquale Tolemo","Stefani Butto",
      "Robert Salaki","Santa Sitrno","Brian Kuck","Terry Kuck",
      "Brian Kuck","Kaitlin Rapkiewicz","John Rapkiewicz",
      "Kaleigh Adkins","Cindy Berbari","Aubrey Berbari","Aubrey Ivie","Eric Ivie",
      "Joe Marquez","Lionetta Marquez","Daniel McCormick","Donna Lambert",
      "Bill Monaco","John Lepoore","Nina Lepoore","Peter Vita","Lisa Vita",

    var guestCount = 1;

    /* ── Autocomplete ── */
    function setupAutocomplete(input) {
      var dropdown = input.parentElement.querySelector('.autocomplete-dropdown');
      var errorEl = input.parentElement.querySelector('.field-error');

      input.addEventListener('input', function() {
        var val = this.value.trim().toLowerCase();
        errorEl.textContent = '';
        input.classList.remove('invalid');
        dropdown.innerHTML = '';

        if (val.length < 1) { dropdown.style.display = 'none'; return; }

        var matches = GUESTS.filter(function(name) {
          return name.toLowerCase().indexOf(val) !== -1 && !selectedNames.has(name);
        });

        if (matches.length === 0) {
          dropdown.style.display = 'none';
          return;
        }

        matches.slice(0, 8).forEach(function(name) {
          var item = document.createElement('div');
          item.className = 'autocomplete-item';
          var idx = name.toLowerCase().indexOf(val);
          item.innerHTML = name.substring(0, idx)
            + '<strong>' + name.substring(idx, idx + val.length) + '</strong>'
            + name.substring(idx + val.length);
          item.addEventListener('mousedown', function(e) {
            e.preventDefault();
            var prev = input.getAttribute('data-selected');
            if (prev) selectedNames.delete(prev);
            input.value = name;
            input.setAttribute('data-selected', name);
            selectedNames.add(name);
            dropdown.style.display = 'none';
            errorEl.textContent = '';
            input.classList.remove('invalid');
            updateContinue();
          });
          dropdown.appendChild(item);
        });
        dropdown.style.display = 'block';
      });

      input.addEventListener('focus', function() {
        if (this.value.trim().length >= 1) {
          this.dispatchEvent(new Event('input'));
        }
      });

      input.addEventListener('blur', function() {
        var self = this;
        setTimeout(function() {
          dropdown.style.display = 'none';
          validateField(self);
        }, 150);
      });
    }

    function validateField(input) {
      var val = input.value.trim();
      var errorEl = input.parentElement.querySelector('.field-error');
      if (!val) {
        input.classList.remove('invalid');
        errorEl.textContent = '';
        return false;
      }
      var match = GUESTS.find(function(name) {
        return name.toLowerCase() === val.toLowerCase();
      });
      if (!match) {
        input.classList.add('invalid');
        errorEl.textContent = "Please select a name from the guest list";
        return false;
      }
      if (input.getAttribute('data-selected') !== match) {
        var prev = input.getAttribute('data-selected');
        if (prev) selectedNames.delete(prev);
        input.value = match;
        input.setAttribute('data-selected', match);
        selectedNames.add(match);
      }
      input.classList.remove('invalid');
      errorEl.textContent = '';
      return true;
    }

    /* ── Add guest ── */
    document.getElementById('btnAddGuest').addEventListener('click', function() {
      guestCount++;
      var entry = document.createElement('div');
      entry.className = 'guest-entry';
      entry.setAttribute('data-guest', guestCount);
      entry.innerHTML =
        '<div class="guest-entry-header">' +
          '<span class="guest-entry-label">Guest ' + guestCount + '</span>' +
          '<button type="button" class="icon-button icon-button-sm icon-button-light btn-remove-guest" aria-label="Remove guest" title="Remove guest">' +
            '<svg width="16" height="16" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
              '<path d="M3 3L15 15" stroke="currentColor"/>' +
              '<path d="M3 15L15 3" stroke="currentColor"/>' +
            '</svg>' +
          '</button>' +
        '</div>' +
        '<div class="form-group autocomplete-wrap">' +
          '<label>Name</label>' +
          '<input type="text" name="guest' + guestCount + '_name" autocomplete="off" placeholder="Name">' +
          '<div class="autocomplete-dropdown"></div>' +
          '<p class="field-error"></p>' +
        '</div>' +
        '<fieldset class="form-group attendance">' +
          '<legend>Will you be attending?</legend>' +
          '<div class="attendance-options">' +
            '<label class="attendance-option"><input type="radio" name="guest' + guestCount + '_attending" value="Accepts"><span>Joyfully accepts</span></label>' +
            '<label class="attendance-option"><input type="radio" name="guest' + guestCount + '_attending" value="Declines"><span>Regretfully declines</span></label>' +
          '</div>' +
          '<p class="field-error"></p>' +
        '</fieldset>' +
        '<div class="form-group entree-group" hidden>' +
          '<label>Entree option</label>' +
          '<select name="guest' + guestCount + '_entree" disabled>' +
            '<option value="" disabled selected>Select entree</option>' +
            '<option value="Chicken &amp; Mahi">Chicken &amp; Mahi</option>' +
            '<option value="Short Ribs &amp; Shrimp">Short Ribs &amp; Shrimp</option>' +
          '</select>' +
        '</div>';

      document.getElementById('guestList').appendChild(entry);

      var newInput = entry.querySelector('input[type="text"]');
      setupAutocomplete(newInput);
      setupAttendance(entry);
      newInput.focus();
      updateContinue();

      entry.querySelector('.btn-remove-guest').addEventListener('click', function() {
        var selName = newInput.getAttribute('data-selected');
        if (selName) selectedNames.delete(selName);
        entry.remove();
        renumberGuests();
        updateContinue();
      });
    });

    function renumberGuests() {
      var entries = document.querySelectorAll('.guest-entry');
      entries.forEach(function(entry, i) {
        var num = i + 1;
        entry.setAttribute('data-guest', num);
        var label = entry.querySelector('.guest-entry-label');
        if (label) label.textContent = 'Guest ' + num;
        var nameLabel = entry.querySelector('.autocomplete-wrap label');
        if (nameLabel) nameLabel.textContent = num === 1 ? 'Guest 1 name' : 'Name';
        entry.querySelector('input[type="text"]').name = 'guest' + num + '_name';
        entry.querySelectorAll('.attendance input[type="radio"]').forEach(function(radio) {
          radio.name = 'guest' + num + '_attending';
        });
        entry.querySelector('select').name = 'guest' + num + '_entree';
      });
      guestCount = entries.length;
    }

    /* ── Attendance ── */
    function setupAttendance(entry) {
      var fieldset = entry.querySelector('.attendance');
      var entreeGroup = entry.querySelector('.entree-group');
      var select = entreeGroup.querySelector('select');

      fieldset.addEventListener('change', function(e) {
        if (e.target.type !== 'radio') return;
        fieldset.classList.remove('invalid');
        fieldset.querySelector('.field-error').textContent = '';

        /* Disabled selects aren't submitted, so declined guests send no entree */
        var accepts = e.target.value === 'Accepts';
        entreeGroup.hidden = !accepts;
        select.disabled = !accepts;
        if (!accepts) {
          select.selectedIndex = 0;
          select.classList.remove('filled', 'invalid');
          var err = entreeGroup.querySelector('.field-error');
          if (err) err.textContent = '';
        }
      });
    }

    /* ── Continue visibility ── */
    function isGuestComplete(entry) {
      var name = entry.querySelector('.autocomplete-wrap input[type="text"]').value.trim().toLowerCase();
      var onList = GUESTS.some(function(g) { return g.toLowerCase() === name; });
      var choice = entry.querySelector('.attendance input[type="radio"]:checked');
      if (!onList || !choice) return false;
      return choice.value === 'Declines' || entry.querySelector('.entree-group select').value !== '';
    }

    function updateContinue() {
      var entries = document.querySelectorAll('#guestList .guest-entry');
      var complete = Array.prototype.every.call(entries, isGuestComplete);
      var btn = document.querySelector('#rsvpForm .btn-continue');
      btn.hidden = !complete;
      /* Hidden alone doesn't block submitting with the Enter key */
      btn.disabled = !complete;
    }

    document.getElementById('rsvpForm').addEventListener('input', updateContinue);
    document.getElementById('rsvpForm').addEventListener('change', updateContinue);

    /* ── Form submit validation ── */
    document.getElementById('rsvpForm').addEventListener('submit', function(e) {
      var allValid = true;
      var entries = this.querySelectorAll('.guest-entry');

      entries.forEach(function(entry, i) {
        var input = entry.querySelector('.autocomplete-wrap input[type="text"]');
        var select = entry.querySelector('select');
        var val = input.value.trim();

        /* Name validation */
        if (i === 0 && !val) {
          input.classList.add('invalid');
          input.parentElement.querySelector('.field-error').textContent = 'Please enter your name';
          allValid = false;
        } else if (val && !validateField(input)) {
          allValid = false;
        }

        /* Attendance — required if name is filled (always for guest 1) */
        var namePresent = i === 0 || val;
        var fieldset = entry.querySelector('.attendance');
        var attendanceError = fieldset.querySelector('.field-error');
        var choice = fieldset.querySelector('input[type="radio"]:checked');
        if (namePresent && !choice) {
          fieldset.classList.add('invalid');
          attendanceError.textContent = 'Please let us know if you can make it';
          allValid = false;
        } else {
          fieldset.classList.remove('invalid');
          attendanceError.textContent = '';
        }

        /* Entree validation — required for guests who accept */
        var accepts = choice && choice.value === 'Accepts';
        if (namePresent && accepts && !select.value) {
          select.classList.add('invalid');
          var selectGroup = select.closest('.form-group');
          var selectError = selectGroup.querySelector('.field-error');
          if (!selectError) {
            selectError = document.createElement('p');
            selectError.className = 'field-error';
            selectGroup.appendChild(selectError);
          }
          selectError.textContent = 'Please select an entree';
          allValid = false;
        } else {
          select.classList.remove('invalid');
          var selectGroup = select.closest('.form-group');
          var selectError = selectGroup.querySelector('.field-error');
          if (selectError) selectError.textContent = '';
        }
      });

      e.preventDefault();

      if (!allValid) {
        var firstInvalid = this.querySelector('.invalid');
        if (firstInvalid && firstInvalid.matches('fieldset')) {
          firstInvalid = firstInvalid.querySelector('input[type="radio"]');
        }
        if (firstInvalid) firstInvalid.focus();
        return;
      }

      showConfirmation(this);
    });

    /* Kept by guest name so notes survive "Edit selection" */
    var allergyNotes = {};
    var RSVP_EXIT_MS = 140;
    var RSVP_FILL_MS = 520;

    /* Visit index.html?rsvp-test to run the flow without sending anything to Formspree */
    var RSVP_TEST = /[?&]rsvp-test(&|=|$)/.test(window.location.search);
    var rsvpTestPanel = null;
    if (RSVP_TEST) {
      rsvpTestPanel = document.createElement('aside');
      rsvpTestPanel.className = 'rsvp-test-panel';
      rsvpTestPanel.innerHTML = '<strong>RSVP test mode</strong> Nothing will be sent.<pre></pre>';
      document.body.appendChild(rsvpTestPanel);
    }

    /* Fields grouped per guest so the email reads one guest at a time */
    function buildRsvpData(guests) {
      var data = new FormData();
      data.append('_subject', 'RSVP: ' + guests.map(function(g) { return g.name; }).join(', '));
      guests.forEach(function(g, i) {
        var key = 'guest' + (i + 1);
        data.append(key + '_name', g.name);
        data.append(key + '_attending', g.accepts ? 'Accepts' : 'Declines');
        if (g.accepts) {
          data.append(key + '_entree', g.entree);
          data.append(key + '_allergies', allergyNotes[g.name] || '');
        }
      });
      return data;
    }

    /* ── Send RSVP once the guest confirms ── */
    function submitRsvp(form, box, guests) {
      var btn = box.querySelector('.rsvp-confirm');
      var errorEl = box.querySelector('.submit-error');
      btn.disabled = true;
      btn.textContent = 'Sending…';
      errorEl.textContent = '';

      var data = buildRsvpData(guests);

      if (RSVP_TEST) {
        var lines = [];
        data.forEach(function(value, key) { lines.push(key + ': ' + (value || '(blank)')); });
        rsvpTestPanel.querySelector('pre').textContent = lines.join('\n');
        showConfirmed(box, guests.some(function(g) { return g.accepts; }));
        return;
      }

      fetch(form.action, {
        method: 'POST',
        body: data,
        /* Formspree replies with JSON instead of redirecting to its thank-you page */
        headers: { 'Accept': 'application/json' }
      })
        .then(function(res) {
          if (!res.ok) throw new Error('RSVP failed: ' + res.status);
          showConfirmed(box, guests.some(function(g) { return g.accepts; }));
        })
        .catch(function() {
          btn.disabled = false;
          btn.textContent = 'Confirm';
          errorEl.textContent = 'Something went wrong sending your RSVP. Please try again.';
        });
    }

    /* ── Confirmed state: header changes, then heart, then message ── */
    function showConfirmed(box, anyAccept) {
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var card = box.closest('.rsvp-card');
      var fill = anyAccept && !reduceMotion;
      box.classList.add('is-leaving');

      /* Dark fill starts as the Confirm button and grows to cover the card */
      if (fill) {
        var c = card.getBoundingClientRect();
        var b = box.querySelector('.rsvp-confirm').getBoundingClientRect();
        card.style.setProperty('--rsvp-fill-from',
          (b.top - c.top) + 'px ' + (c.right - b.right) + 'px ' +
          (c.bottom - b.bottom) + 'px ' + (b.left - c.left) + 'px');
        card.classList.add('is-filling');
        window.setTimeout(function() {
          card.classList.add('is-dark');
          card.classList.remove('is-filling');
        }, RSVP_FILL_MS);
      }

      window.setTimeout(function() {
        box.classList.remove('is-leaving');
        box.innerHTML =
          '<h2 class="type-title-script rsvp-confirmation-title" tabindex="-1"></h2>' +
          '<div class="rsvp-note">' +
            '<img class="rsvp-note-heart" alt="">' +
            '<p class="font-funk rsvp-note-text"></p>' +
          '</div>' +
          '<a href="registry.html" class="btn btn-secondary rsvp-registry">View registry</a>';

        var title = box.querySelector('.rsvp-confirmation-title');
        title.textContent = anyAccept ? 'Yay!' : 'All good!';
        box.querySelector('.rsvp-note-heart').src = anyAccept
          ? 'images/illustration/heart-note-attending.svg'
          : 'images/illustration/heart-note-missed.svg';
        box.querySelector('.rsvp-note-text').innerHTML = anyAccept
          ? 'SEE YA ON THE<br>DANCE FLOOR...'
          : 'YOU WILL<br>BE MISSED...';

        box.classList.add('is-confirmed', 'is-entering');
        if (anyAccept && !fill) card.classList.add('is-dark');
        title.focus();
      }, reduceMotion ? 0 : fill ? RSVP_FILL_MS / 2 : RSVP_EXIT_MS);
    }

    /* ── Review step (Figma 200:2207) ── */
    function showConfirmation(form) {
      var heading = form.closest('.rsvp-card').querySelector('.rsvp-heading');
      var guests = Array.prototype.map.call(form.querySelectorAll('.guest-entry'), function(entry) {
        var choice = entry.querySelector('.attendance input[type="radio"]:checked');
        return {
          name: entry.querySelector('.autocomplete-wrap input[type="text"]').value.trim(),
          accepts: choice.value === 'Accepts',
          entree: entry.querySelector('.entree-group select').value
        };
      });
      var anyAccept = guests.some(function(g) { return g.accepts; });

      var box = document.createElement('div');
      box.className = 'rsvp-confirmation ' + (anyAccept ? 'is-attending' : 'is-missed');
      box.setAttribute('role', 'status');
      box.innerHTML =
        '<h2 class="font-funk type-subhead rsvp-confirmation-title" tabindex="-1">PLEASE CONFIRM</h2>' +
        '<ul class="rsvp-guest-list"></ul>' +
        '<div class="rsvp-confirmation-actions">' +
          '<button type="button" class="btn btn-secondary rsvp-return">Edit selection</button>' +
          '<button type="button" class="btn btn-primary rsvp-confirm">Confirm</button>' +
          '<p class="field-error submit-error" role="alert"></p>' +
        '</div>';

      var list = box.querySelector('.rsvp-guest-list');
      guests.forEach(function(g) {
        var item = document.createElement('li');
        item.className = 'rsvp-guest';
        item.innerHTML =
          '<span class="rsvp-guest-chip">' +
            '<span class="rsvp-guest-icon' + (g.accepts ? '' : ' is-declined') + '">' +
              '<img src="images/icon/' + (g.accepts ? 'checkmark-16-green.svg' : 'close-16-rose.svg') + '"' +
                ' alt="' + (g.accepts ? 'Attending:' : 'Not attending:') + '" width="16" height="16">' +
            '</span>' +
            '<span class="rsvp-guest-name"></span>' +
          '</span>';
        var label = g.name;
        if (g.accepts) label += ' / ' + g.entree;
        else if (!anyAccept) label += ' / Not attending';
        item.querySelector('.rsvp-guest-name').textContent = label;

        if (g.accepts) {
          var field = document.createElement('div');
          field.className = 'form-group rsvp-allergies';
          var input = document.createElement('input');
          input.type = 'text';
          input.placeholder = 'Food allergies (optional)';
          input.setAttribute('aria-label', 'Food allergies for ' + g.name + ' (optional)');
          input.value = allergyNotes[g.name] || '';
          input.addEventListener('input', function() { allergyNotes[g.name] = input.value; });
          field.appendChild(input);
          item.appendChild(field);
        }
        list.appendChild(item);
      });

      box.querySelector('.rsvp-return').addEventListener('click', function() {
        box.replaceWith(form);
        heading.hidden = false;
        updateContinue();
        form.querySelector('.autocomplete-wrap input[type="text"]').focus();
      });

      box.querySelector('.rsvp-confirm').addEventListener('click', function() {
        submitRsvp(form, box, guests);
      });

      heading.hidden = true;
      form.replaceWith(box);
      box.querySelector('.rsvp-confirmation-title').focus();
    }

    /* ── Select filled state ── */
    function setupSelectState(select) {
      select.addEventListener('change', function() {
        this.classList.toggle('filled', this.value !== '');
        /* Clear invalid state on selection */
        if (this.value) {
          this.classList.remove('invalid');
          var err = this.closest('.form-group').querySelector('.field-error');
          if (err) err.textContent = '';
        }
      });
    }

    document.querySelectorAll('.form-group select').forEach(setupSelectState);

    /* Hook into addGuest to also setup new selects */
    var origAddClick = document.getElementById('btnAddGuest').onclick;
    var addBtn = document.getElementById('btnAddGuest');
    addBtn.addEventListener('click', function() {
      setTimeout(function() {
        document.querySelectorAll('.form-group select:not(.select-ready)').forEach(function(sel) {
          setupSelectState(sel);
          sel.classList.add('select-ready');
        });
      }, 0);
    });

    /* ── Init autocomplete on first guest ── */
    setupAutocomplete(document.querySelector('.guest-entry input[type="text"]'));
    setupAttendance(document.querySelector('.guest-entry'));
  </script>

</body>
